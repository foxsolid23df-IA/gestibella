# Supabase local config — used by supabase CLI
[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000", "https://slpwotimpftumhvepbgi.supabase.co"]
jwt_expiry = 3600
enable_signup = true
enable_confirmations = true
enable_manual_linking = true
# Hook para inyectar tenant_id en JWT (activar en dashboard → Auth → Hooks → Custom Access Token)
# custom_access_token_hook = "public.custom_access_token_hook"
